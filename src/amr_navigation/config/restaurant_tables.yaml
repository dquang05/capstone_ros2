# ==============================================================================
# Restaurant Tables & Service Standoff Poses Configuration
# Food Delivery AMR - Restaurant Environment: Pizza 4P's Landmark 72
# ==============================================================================
# Rules for coordinates:
# - All positions (x, y, yaw) are located in the walkable corridor spaces
#   with safe clearance (0.4m - 0.6m) from physical tables & chairs.
# - Target yaw orients the robot's delivery tray facing the customer table.
# - Each table belongs to a group. If the primary target is blocked, the
#   navigation dispatcher automatically attempts fallback_table_ids.
# ==============================================================================

